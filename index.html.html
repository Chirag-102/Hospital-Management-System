<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hospital Management System - User & Admin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" patternUnits="userSpaceOnUse" width="100" height="100"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.03)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.02)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.04)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
      pointer-events: none;
      z-index: -1;
    }
    
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 30px;
      font-size: 2.5rem;
      font-weight: 300;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: 1px;
    }
    
    h1::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #27ae60, #2ecc71);
      margin: 15px auto;
      border-radius: 2px;
    }
    
    #login, #admin-view, #user-view {
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
    }
    
    #login::before, #admin-view::before, #user-view::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #27ae60, #2ecc71, #3498db);
    }
    
    h2 {
      color: #2c3e50;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 1.8rem;
      text-align: center;
    }
    
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: 600;
      color: #34495e;
      font-size: 0.95rem;
    }
    
    input[type=text], input[type=password], input[type=number], select, input[type=datetime-local] {
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      border: 2px solid #e8f4f8;
      font-size: 16px;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.9);
    }
    
    input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, 
    select:focus, input[type=datetime-local]:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      transform: translateY(-2px);
    }
    
    input::placeholder {
      color: #95a5a6;
      font-style: italic;
    }
    
    button {
      margin-top: 20px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: white;
      border: none;
      padding: 16px 24px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
    }
    
    button:hover::before {
      left: 100%;
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .form-container {
      background: linear-gradient(135deg, #f8f9ff 0%, #e8f4f8 100%);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      border: 1px solid rgba(52, 152, 219, 0.1);
    }
    
    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }
    
    th {
      background: linear-gradient(135deg, #34495e, #2c3e50);
      color: white;
      padding: 18px 15px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.9rem;
    }
    
    td {
      padding: 16px 15px;
      border-bottom: 1px solid #ecf0f1;
      text-align: left;
      transition: background-color 0.3s ease;
    }
    
    tr:hover {
      background: linear-gradient(90deg, rgba(52, 152, 219, 0.05), rgba(155, 89, 182, 0.05));
      transform: scale(1.01);
    }
    
    tr:nth-child(even) {
      background: rgba(236, 240, 241, 0.3);
    }
    
    .delete-btn {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      border: none;
      color: white;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      width: auto;
      margin: 0;
    }
    
    .delete-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.3);
    }
    
    .logout-btn {
      background: linear-gradient(135deg, #3498db, #2980b9);
      margin-top: 20px;
    }
    
    .logout-btn:hover {
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
    }
    
    .error {
      color: #e74c3c;
      margin-top: 15px;
      font-weight: 600;
      padding: 12px;
      background: rgba(231, 76, 60, 0.1);
      border-radius: 8px;
      border-left: 4px solid #e74c3c;
    }
    
    .welcome-message {
      background: linear-gradient(135deg, #3498db, #9b59b6);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 500;
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.2);
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #ffffff, #f8f9fa);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
      transition: transform 0.3s ease;
    }
    
    .stat-card:hover {
      transform: translateY(-5px);
    }
    
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    
    .stat-label {
      color: #7f8c8d;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    
    .medical-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px;
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
    }
    
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      #login, #admin-view, #user-view {
        padding: 25px 20px;
      }
      
      table {
        font-size: 0.9rem;
      }
      
      th, td {
        padding: 12px 8px;
      }
      
      .stats-container {
        grid-template-columns: 1fr;
      }
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
      100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
    }
  </style>
</head>
<body>

  <h1>🏥 Hospital Management System</h1>

  <!-- Login Section -->
  <div id="login" class="fade-in">
    <div class="medical-icon">👩‍⚕️</div>
    <h2>Welcome Back</h2>
    <div class="form-container">
      <label for="role">Select Role:</label>
      <select id="role" required>
        <option value="" disabled selected>Choose your role</option>
        <option value="admin">👨‍💼 Admin</option>
        <option value="user">👤 User</option>
      </select>
      
      <div id="admin-password-field" style="display:none;">
        <label for="admin-password">Admin Password:</label>
        <input type="password" id="admin-password" placeholder="Enter admin password" />
      </div>

      <div id="user-username-field" style="display:none;">
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter your username" />
      </div>

      <button id="login-btn" class="pulse">Login</button>
      <p class="error" id="login-error" style="display:none;"></p>
    </div>
  </div>

  <!-- Admin View -->
  <div id="admin-view" style="display:none;" class="fade-in">
    <div class="medical-icon">⚕️</div>
    <h2>Admin Dashboard</h2>
    
    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-number" id="total-patients">0</div>
        <div class="stat-label">Total Patients</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="today-appointments">0</div>
        <div class="stat-label">Today's Appointments</div>
      </div>
    </div>
    
    <div class="form-container">
      <form id="patient-form">
        <label for="patient-name">👤 Patient Name:</label>
        <input type="text" id="patient-name" placeholder="Enter patient name" required />

        <label for="patient-age">🎂 Age:</label>
        <input type="number" id="patient-age" placeholder="Enter age" min="0" required />

        <label for="patient-disease">🏥 Disease:</label>
        <input type="text" id="patient-disease" placeholder="Enter disease" required />

        <label for="patient-username">👨‍💻 Assign to Username:</label>
        <input type="text" id="patient-username" placeholder="Enter username for patient" required />
        
        <label for="appointment-time">📅 Appointment Time:</label>
        <input type="datetime-local" id="appointment-time" required />

        <button type="submit">➕ Add Patient Appointment</button>
      </form>
    </div>

    <table id="patients-table">
      <thead>
        <tr>
          <th>#</th>
          <th>👤 Name</th>
          <th>🎂 Age</th>
          <th>🏥 Disease</th>
          <th>👨‍💻 Username</th>
          <th>📅 Appointment Time</th>
          <th>⚡ Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Patient rows here -->
      </tbody>
    </table>
    <button class="logout-btn" id="logout-admin">🚪 Logout</button>
  </div>

  <!-- User View -->
  <div id="user-view" style="display:none;" class="fade-in">
    <div class="medical-icon">🩺</div>
    <h2>User Dashboard</h2>
    <div class="welcome-message">
      <p>Welcome, <strong><span id="user-display-name"></span></strong>! Here are your appointment details:</p>
    </div>
    <table id="user-patients-table">
      <thead>
        <tr>
          <th>#</th>
          <th>👤 Name</th>
          <th>🎂 Age</th>
          <th>🏥 Disease</th>
          <th>📅 Appointment Time</th>
        </tr>
      </thead>
      <tbody>
        <!-- User's appointments here -->
      </tbody>
    </table>
    <button class="logout-btn" id="logout-user">🚪 Logout</button>
  </div>

<script>
  // Store patients with assigned usernames (simulate DB)
  let patients = [
    {
      name: "John Doe",
      age: 45,
      disease: "Diabetes",
      username: "john123",
      appointmentTime: "2025-09-20T14:00"
    },
    {
      name: "Mary Jane",
      age: 30,
      disease: "Flu",
      username: "maryj",
      appointmentTime: "2025-09-18T09:30"
    },
  ];

  // Elements
  const loginDiv = document.getElementById('login');
  const roleSelect = document.getElementById('role');
  const adminPasswordField = document.getElementById('admin-password-field');
  const adminPasswordInput = document.getElementById('admin-password');
  const userUsernameField = document.getElementById('user-username-field');
  const usernameInput = document.getElementById('username');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');

  const adminView = document.getElementById('admin-view');
  const userView = document.getElementById('user-view');

  const patientForm = document.getElementById('patient-form');
  const patientsTableBody = document.querySelector('#patients-table tbody');

  const userPatientsTableBody = document.querySelector('#user-patients-table tbody');
  const userDisplayName = document.getElementById('user-display-name');

  const logoutAdminBtn = document.getElementById('logout-admin');
  const logoutUserBtn = document.getElementById('logout-user');

  let currentUser = null; // store current logged in username or 'admin'

  // Show input fields based on role selection
  roleSelect.addEventListener('change', () => {
    loginError.style.display = 'none';
    adminPasswordInput.value = '';
    usernameInput.value = '';
    if(roleSelect.value === 'admin') {
      adminPasswordField.style.display = 'block';
      userUsernameField.style.display = 'none';
    } else if(roleSelect.value === 'user') {
      adminPasswordField.style.display = 'none';
      userUsernameField.style.display = 'block';
    } else {
      adminPasswordField.style.display = 'none';
      userUsernameField.style.display = 'none';
    }
  });

  // Login button click
  loginBtn.addEventListener('click', () => {
    loginError.style.display = 'none';
    const role = roleSelect.value;
    if(!role) {
      showError('Please select a role.');
      return;
    }

    if(role === 'admin') {
      const pass = adminPasswordInput.value.trim();
      if(pass === 'admin123') { // hardcoded admin password
        currentUser = 'admin';
        showAdminView();
      } else {
        showError('Invalid admin password.');
      }
    } else if(role === 'user') {
      const uname = usernameInput.value.trim();
      if(!uname) {
        showError('Please enter your username.');
        return;
      }
      // Check if user has any appointment assigned (optional)
      const hasAppointment = patients.some(p => p.username.toLowerCase() === uname.toLowerCase());
      if(hasAppointment) {
        currentUser = uname.toLowerCase();
        showUserView();
      } else {
        showError('No appointment found for this username.');
      }
    }
  });

  // Show error message
  function showError(msg) {
    loginError.textContent = msg;
    loginError.style.display = 'block';
  }

  // Show admin dashboard
  function showAdminView() {
    loginDiv.style.display = 'none';
    userView.style.display = 'none';
    adminView.style.display = 'block';
    renderAdminPatients();
    updateStats();
  }

  // Show user dashboard
  function showUserView() {
    loginDiv.style.display = 'none';
    adminView.style.display = 'none';
    userView.style.display = 'block';
    userDisplayName.textContent = currentUser;
    renderUserPatients();
  }

  // Update statistics
  function updateStats() {
    document.getElementById('total-patients').textContent = patients.length;
    const today = new Date().toDateString();
    const todayAppointments = patients.filter(p => new Date(p.appointmentTime).toDateString() === today).length;
    document.getElementById('today-appointments').textContent = todayAppointments;
  }

  // Admin logout
  logoutAdminBtn.addEventListener('click', () => {
    currentUser = null;
    adminView.style.display = 'none';
    loginDiv.style.display = 'block';
    adminPasswordInput.value = '';
    roleSelect.value = '';
  });

  // User logout
  logoutUserBtn.addEventListener('click', () => {
    currentUser = null;
    userView.style.display = 'none';
    loginDiv.style.display = 'block';
    usernameInput.value = '';
    roleSelect.value = '';
  });

  // Admin form submit to add patient
  patientForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('patient-name').value.trim();
    const age = document.getElementById('patient-age').value.trim();
    const disease = document.getElementById('patient-disease').value.trim();
    const username = document.getElementById('patient-username').value.trim().toLowerCase();
    const appointmentTime = document.getElementById('appointment-time').value;

    if(!name || !age || !disease || !username || !appointmentTime) {
      alert('Please fill all patient fields including appointment time.');
      return;
    }

    // Add new patient with assigned username & appointment time
    patients.push({name, age, disease, username, appointmentTime});
    patientForm.reset();
    renderAdminPatients();
    updateStats();
  });

  // Render all patients in admin table
  function renderAdminPatients() {
    patientsTableBody.innerHTML = '';
    patients.forEach((p, idx) => {
      const tr = document.createElement('tr');
      // Format datetime for display (local)
      const formattedDate = new Date(p.appointmentTime).toLocaleString();
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${p.name}</td>
        <td>${p.age}</td>
        <td>${p.disease}</td>
        <td>${p.username}</td>
        <td>${formattedDate}</td>
        <td><button class="delete-btn" data-index="${idx}">Delete</button></td>
      `;
      patientsTableBody.appendChild(tr);
    });

    // Add delete event listeners
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const index = e.target.getAttribute('data-index');
        patients.splice(index, 1);
        renderAdminPatients();
        updateStats();
      });
    });
  }

  // Render user's own appointments only
  function renderUserPatients() {
    userPatientsTableBody.innerHTML = '';
    // Filter patients by currentUser username
    const userPatients = patients.filter(p => p.username.toLowerCase() === currentUser);
    if(userPatients.length === 0) {
      userPatientsTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No appointments found.</td></tr>';
      return;
    }
    userPatients.forEach((p, idx) => {
      const tr = document.createElement('tr');
      const formattedDate = new Date(p.appointmentTime).toLocaleString();
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${p.name}</td>
        <td>${p.age}</td>
        <td>${p.disease}</td>
        <td>${formattedDate}</td>
      `;
      userPatientsTableBody.appendChild(tr);
    });
  }
</script>

</body>
</html>
